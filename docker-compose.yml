services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workchat
      POSTGRES_USER: workchat
      POSTGRES_PASSWORD: workchat
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workchat -d workchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
