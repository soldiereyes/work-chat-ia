  architectural_questions:
    - Como unificar fluxo síncrono (validação UX) e assíncrono (ADR-002) em um contrato de API? (PD-04)
    - Delivery é bounded context separado ou submódulo de Message Communication? (PD-05)
    - Ordem exata CommunicationPolicy vs AIReviewService no worker MessageCreated? (PD-06)
    - Onde persistir ReviewResult — agregado MessageReview apenas ou DTO de aplicação? (derivar de entidades.md)
    - Contrato de RealtimeGateway vs evento ReviewCompleted (eventos-de-dominio.md)
    - Estratégia de mock ChannelGateway e estados SENT/DELIVERED

  database_questions:
    - Tabelas mínimas alinhadas a account, user, conversation, message, message_review, review_suggestion (skill DBA)
    - Necessidade de outbox para MessageCreated + worker (PD-07)
    - Constraints para impedir aprovação/envio em BLOCKED
    - Isolamento por accountId em todas as queries críticas (REQ-NF-005)

  risks:
    - Conflito documental sync vs async (mvp-00-auditoria C-01)
    - Código esboço em backend/ pode divergir do contrato se implementação não reconciliar
    - Cards MVP-01..10 não publicados — risco de desalinhamento com Issue #2 (PD-09)
    - Decisão de áudio sem revisão (PD-01)

  out_of_scope:
    - Implementação de código neste handoff
    - Integrações reais de canal e webhooks de produção
    - Keycloak, Kafka/RabbitMQ primário, OpenSearch
    - UI admin de políticas e analytics
    - Eventos MessageApproved/MessageDelivered até haver consumidores

