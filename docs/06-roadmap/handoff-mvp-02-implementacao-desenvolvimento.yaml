handoff:
  from: implementacao
  to:
    - desenvolvedores
    - dba
    - qualidade

  card: MVP-02

  objective: >
    Conversation Management e Message Communication persistidos com isolamento por
    Account, Outbox transacional MessageCreated v1, sem Review/Delivery.

  requirements:
    - REQ-F-002
    - REQ-F-003

  acceptance_criteria:
    - AC-003
    - AC-020

  bounded_contexts:
    - Conversation Management
    - Message Communication

  artifacts:
    - backend/src/main/java/com/workchatia/conversation/
    - backend/src/main/java/com/workchatia/message/
    - backend/src/main/java/com/workchatia/shared/domain/event/
    - backend/src/main/java/com/workchatia/shared/infrastructure/JpaOutboxRepository.java
    - backend/src/main/resources/db/migration/V3__conversation_message_outbox.sql
    - backend/src/main/resources/db/migration-dev/V4__identity_seed_carol_professional.sql
    - backend/src/test/java/com/workchatia/conversation/
    - backend/src/test/java/com/workchatia/message/domain/MessageTest.java
    - docs/06-roadmap/mvp-02-validacao-qualidade.md
    - docs/03-arquitetura/plano-implementacao-mvp.md

  api_contracts:
    - POST /api/v1/conversations
    - GET /api/v1/conversations
    - GET /api/v1/conversations/{conversationId}
    - PATCH /api/v1/conversations/{conversationId}
    - POST /api/v1/conversations/{conversationId}/messages
    - GET /api/v1/conversations/{conversationId}/messages
    - GET /api/v1/conversations/{conversationId}/messages/{messageId}
    - PATCH /api/v1/conversations/{conversationId}/messages/{messageId}

  events:
    - eventType: MessageCreated
      version: 1
      transport: outbox_events (PostgreSQL)

  database_change: true
  migrations:
    - V3__conversation_message_outbox.sql
    - V4__identity_seed_carol_professional.sql (dev/test via migration-dev)

  tests_executed:
    - command: mvn clean test
      expected_tests_run: 40
      result: PASS

  quality_report:
    - docs/06-roadmap/mvp-02-validacao-qualidade.md
    verdict: PASS

  reconciliation_notes:
    - Tabelas message/outbox entregues em MVP-02 (issue #4); MVP-03 foca policy + submit HTTP
    - MessageCreated v1 pode ocorrer com Message em DRAFT; consumidores MUST ignorar até PENDING_REVIEW (submit MVP-03)
    - Probe POST /api/v1/messages mantido até MVP-03
    - Correções QA Q-201 a Q-206 cobertas na suíte de 40 testes (revalidação 2026-09-22)

  risks:
    - Publicador outbox ausente até MVP-06
    - Enum MessageStatus inclui estados futuros sem transições expostas na API

  out_of_scope:
    - Review, LLM, Delivery, DELETE, WebSocket

  next_gate: >
    MVP-03 CommunicationPolicy determinística + submit para revisão.

  state: IMPLEMENTATION_READY
