spring:
  application:
    name: work-chat-ia
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:workchat}
    username: ${DB_USER:workchat}
    password: ${DB_PASSWORD:workchat}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

workchat:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-change-me-use-long-random-string}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

server:
  port: ${SERVER_PORT:8080}
